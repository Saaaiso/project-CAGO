openapi: 3.0.3
info:
  title: CAGO API
  version: 0.3.0
  description: |
    API платформы точечного земледелия и мониторинга пастбищ (CAGO).

    **В этой версии реализованы только регистрация, авторизация и заявки на смену роли.**
    Поля, пастбища, анализы, отчёты и дашборд будут добавлены позже.

    ## Роли

    | Роль | Как получается |
    |---|---|
    | `Farmer` | Назначается автоматически при регистрации |
    | `Official` | Сотрудник айыл окмоту. Фермер подаёт заявку, администратор её одобряет |
    | `Admin` | Заводится вручную (seed-скрипт / миграция) |

    ## Хранение ролей

    Таблицы: `users`, `role`, `role_users` (связь многие-ко-многим).
    У пользователя может быть несколько ролей: после одобрения заявки в `role_users` добавляется
    запись `Official`, а `Farmer` остаётся.

    Для заявок нужна ещё одна таблица `role_requests`
    (`id`, `user_id`, `requested_role_id`, `status`, `organization`, `comment`, `reject_reason`,
    `reviewed_by`, `created_at`, `reviewed_at`).

    ## Сценарий получения роли Official

    1. Пользователь регистрируется через `POST /auth/register`, получает роль `Farmer`.
    2. Подаёт заявку `POST /role-requests`, статус `Pending`.
    3. Администратор смотрит `GET /admin/role-requests` и вызывает `approve` или `reject`.
    4. При `approve` в одной транзакции статус заявки меняется на `Approved` и в `role_users` добавляется `Official`.
    5. Роли лежат в JWT, поэтому после одобрения пользователю нужно заново войти (`POST /auth/login`).
       Актуальные роли всегда возвращает `GET /auth/me`.

    Формат ошибок: [RFC 7807 Problem Details](https://datatracker.ietf.org/doc/html/rfc7807).
  contact:
    name: Команда CAGO
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный запуск через docker compose
tags:
  - name: System
    description: Служебные эндпоинты
  - name: Auth
    description: Регистрация и авторизация
  - name: RoleRequests
    description: Заявки пользователя на роль Official
  - name: Admin
    description: Рассмотрение заявок (только Admin)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Проверка работоспособности
      description: Используется для `healthcheck` в docker compose. Проверяет PostgreSQL.
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: Healthy }
                  postgres: { type: string, example: Healthy }
        '503':
          description: Одна из зависимостей недоступна

  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: |
        Создаёт пользователя и добавляет ему роль `Farmer` в `role_users`.
        Роль `Official` через регистрацию получить нельзя, для неё есть заявка (`POST /role-requests`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход. В токен попадают актуальные роли пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      description: Роли берутся из БД, а не из токена, поэтому после одобрения заявки они обновляются сразу.
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /role-requests:
    post:
      tags: [RoleRequests]
      summary: Подать заявку на роль Official
      description: |
        Доступно пользователю с ролью `Farmer`, у которого ещё нет роли `Official`.
        Одновременно может существовать только одна заявка в статусе `Pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequestCreate'
      responses:
        '201':
          description: Заявка создана
          headers:
            Location:
              schema: { type: string }
              description: URL созданной заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Уже есть активная заявка или роль `Official` уже назначена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [RoleRequests]
      summary: Мои заявки
      description: История заявок текущего пользователя, от новых к старым.
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /role-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    delete:
      tags: [RoleRequests]
      summary: Отозвать свою заявку
      description: Только для заявки в статусе `Pending`. Заявка получает статус `Cancelled`.
      responses:
        '204':
          description: Заявка отозвана
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка уже рассмотрена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/role-requests:
    get:
      tags: [Admin]
      summary: Список заявок (только Admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Фильтр по статусу. По умолчанию возвращаются все
          schema:
            $ref: '#/components/schemas/RoleRequestStatus'
      responses:
        '200':
          description: Страница заявок (по убыванию даты создания)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/role-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Admin]
      summary: Одобрить заявку (только Admin)
      description: |
        В одной транзакции: статус заявки -> `Approved`, в `role_users` добавляется запрошенная роль.
        Пользователю нужно заново войти, чтобы новая роль попала в токен.
      responses:
        '200':
          description: Заявка одобрена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка уже рассмотрена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/role-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Admin]
      summary: Отклонить заявку (только Admin)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Причина отказа, пользователь увидит её в своей заявке
                  example: Не удалось подтвердить должность
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка уже рассмотрена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT содержит `sub` (id пользователя) и `roles` (массив ролей, например `["Farmer", "Official"]`).

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Роль пользователя не позволяет выполнить действие
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден или недоступен пользователю
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string, example: Not Found }
        status: { type: integer, example: 404 }
        detail: { type: string }
        traceId: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example:
                email: ['Некорректный email']

    Role:
      type: string
      enum: [Farmer, Official, Admin]

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        name: { type: string, minLength: 1, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Время жизни токена в секундах, example: 3600 }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          description: Все роли пользователя из `role_users`
          items:
            $ref: '#/components/schemas/Role'
          example: [Farmer]
        createdAt: { type: string, format: date-time }

    RoleRequestStatus:
      type: string
      enum: [Pending, Approved, Rejected, Cancelled]

    RoleRequestCreate:
      type: object
      required: [organization]
      properties:
        requestedRole:
          type: string
          enum: [Official]
          default: Official
          description: Сейчас можно запросить только `Official`
        organization:
          type: string
          minLength: 1
          maxLength: 200
          description: Название айыл окмоту, где работает пользователь
          example: Ак-Суу айыл окмоту
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Должность, контакты для проверки и т.п.
          example: Специалист по земельным ресурсам, тел. +996 555 000 000

    RoleRequest:
      type: object
      required: [id, userId, requestedRole, status, organization, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        userEmail: { type: string, format: email }
        requestedRole:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/RoleRequestStatus'
        organization: { type: string }
        comment: { type: string, nullable: true }
        rejectReason: { type: string, nullable: true }
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: Id администратора, рассмотревшего заявку
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }

    RoleRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleRequest'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }