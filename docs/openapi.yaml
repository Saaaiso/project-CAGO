openapi: 3.0.3
info:
  title: CAGO API
  version: 0.2.0
  description: |
    API платформы точечного земледелия и мониторинга пастбищ (CAGO).

    Платформа обслуживает две группы пользователей:

    | Роль | Кто это | Что делает в MVP |
    |---|---|---|
    | `Farmer` | Фермер | Ведёт свои поля, запускает погодный анализ, смотрит историю и скачивает отчёты. Видит пастбища своей территории (только чтение) |
    | `Official` | Сотрудник айыл окмоту | Ведёт пастбища своей территории, запускает их анализ, смотрит дашборд территории. Видит поля фермеров территории (только чтение) |

    Аккаунты `Official` не создаются через регистрацию: их заводит администратор (seed-скрипт / миграция).
    `Farmer` регистрируется сам и выбирает свою территорию (айыл аймак).

    **Основной сценарий (MVP):** пользователь создаёт объект (поле или пастбище, GeoJSON-полигон) -> запускает анализ
    за период -> backend ставит задачу в Redis и сразу отвечает `202` -> воркер забирает погоду
    из Open-Meteo, считает показатели (осадки, GDD, индекс засухи) и пишет результат в PostgreSQL ->
    фронт опрашивает `GET /analyses/{analysisId}` до статуса `Done` или `Failed`.
    Для пастбищ последний результат анализа попадает в дашборд айыл окмоту.

    **Ожидаемое время отклика (p95, при нагрузке до 25 RPS):**

    | Эндпоинт | p95 |
    |---|---|
    | `POST /auth/login`, `POST /auth/register` | < 500 мс (хеширование пароля) |
    | `GET /fields`, `GET /pastures`, `GET /*/{id}` | < 200 мс |
    | `POST/PUT` для полей и пастбищ | < 300 мс |
    | `POST /{fields,pastures}/{id}/analyses` (только постановка в очередь) | < 300 мс |
    | `GET /analyses/{id}` | < 150 мс |
    | `GET /dashboard/territory` (агрегаты, кэш в Redis 60 с) | < 500 мс |
    | Выполнение анализа воркером (асинхронно) | < 30 с |

    **Вне MVP (планы развития, в API не реализовано):**
    - спутниковые данные и индексы растительности (NDVI), растры в MinIO;
    - расчёт нагрузки на пастбище (поголовье, сезонная ротация, отгонное животноводство);
    - уведомления (Telegram/e-mail) о засухе и критическом состоянии пастбищ;
    - уровни выше территории: район, область, республика;
    - сравнение сезонов и прогноз состояния пастбищ;
    - сводные отчёты для айыл окмоту (PDF/Excel) по всей территории;
    - мобильное приложение и офлайн-режим для работы в горах.

    Формат ошибок: [RFC 7807 Problem Details](https://datatracker.ietf.org/doc/html/rfc7807).
  contact:
    name: Команда CAGO
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный запуск через docker compose
tags:
  - name: System
    description: Служебные эндпоинты
  - name: Auth
    description: Регистрация и авторизация
  - name: Territories
    description: Территории (айыл аймаки)
  - name: Fields
    description: Поля фермеров
  - name: Pastures
    description: Пастбища территории
  - name: Analyses
    description: Асинхронные анализы погодных данных по полю или пастбищу
  - name: Reports
    description: Экспорт результатов анализа (файлы в MinIO)
  - name: Dashboard
    description: Сводка по территории для айыл окмоту

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Проверка работоспособности
      description: Используется для `healthcheck` в docker compose. Проверяет PostgreSQL и Redis.
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: Healthy }
                  postgres: { type: string, example: Healthy }
                  redis: { type: string, example: Healthy }
        '503':
          description: Одна из зависимостей недоступна

  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация фермера
      description: Всегда создаёт пользователя с ролью `Farmer`. Сотрудников айыл окмоту создаёт администратор.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход (фермер или сотрудник айыл окмоту)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь (с ролью и территорией)
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /territories:
    get:
      tags: [Territories]
      summary: Список территорий (айыл аймаков)
      description: Публичный справочник, нужен для выбора территории при регистрации.
      security: []
      responses:
        '200':
          description: Территории
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Territory'

  /fields:
    get:
      tags: [Fields]
      summary: Список полей
      description: |
        `Farmer` получает свои поля. `Official` получает поля всех фермеров своей территории (только чтение).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница полей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Fields]
      summary: Создать поле (только Farmer)
      description: Геометрия валидируется (замкнутый полигон, координаты в WGS84). Центроид и площадь считаются на сервере. Территория берётся из профиля фермера.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
      responses:
        '201':
          description: Поле создано
          headers:
            Location:
              schema: { type: string }
              description: URL созданного поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      tags: [Fields]
      summary: Получить поле
      description: Доступно владельцу и сотрудникам айыл окмоту той же территории.
      responses:
        '200':
          description: Поле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Fields]
      summary: Обновить поле (только владелец)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
      responses:
        '200':
          description: Обновлённое поле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Fields]
      summary: Удалить поле вместе с его анализами (только владелец)
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /fields/{fieldId}/analyses:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    post:
      tags: [Analyses]
      summary: Запустить анализ поля (только владелец)
      description: |
        Создаёт запись со статусом `Pending` и ставит задачу в очередь Redis.
        Ответ приходит сразу, результат нужно получать через `GET /analyses/{analysisId}`.
        Если передан заголовок `Idempotency-Key`, повторный запрос с тем же ключом вернёт уже созданный анализ.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCreate'
      responses:
        '202':
          $ref: '#/components/responses/AnalysisAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyAnalyses'
    get:
      tags: [Analyses]
      summary: История анализов поля
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AnalysisStatus'
      responses:
        '200':
          description: Страница анализов (по убыванию даты создания)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /pastures:
    get:
      tags: [Pastures]
      summary: Список пастбищ территории
      description: |
        Возвращает пастбища территории текущего пользователя (и для `Farmer`, и для `Official`).
        В каждом пастбище есть краткий итог последнего завершённого анализа.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: droughtLevel
          in: query
          description: Фильтр по уровню засухи последнего анализа
          schema:
            $ref: '#/components/schemas/DroughtLevel'
      responses:
        '200':
          description: Страница пастбищ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasturePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Pastures]
      summary: Создать пастбище (только Official)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
      responses:
        '201':
          description: Пастбище создано
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pasture'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pastures/{pastureId}:
    parameters:
      - $ref: '#/components/parameters/PastureId'
    get:
      tags: [Pastures]
      summary: Получить пастбище
      responses:
        '200':
          description: Пастбище
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pasture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pastures]
      summary: Обновить пастбище (только Official своей территории)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
      responses:
        '200':
          description: Обновлённое пастбище
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pasture'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pastures]
      summary: Удалить пастбище вместе с анализами (только Official своей территории)
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /pastures/{pastureId}/analyses:
    parameters:
      - $ref: '#/components/parameters/PastureId'
    post:
      tags: [Analyses]
      summary: Запустить анализ пастбища (только Official)
      description: Работает так же, как анализ поля, результат используется в дашборде территории.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCreate'
      responses:
        '202':
          $ref: '#/components/responses/AnalysisAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyAnalyses'
    get:
      tags: [Analyses]
      summary: История анализов пастбища
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AnalysisStatus'
      responses:
        '200':
          description: Страница анализов (по убыванию даты создания)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Analyses]
      summary: Статус и результат анализа
      description: |
        Поле `result` заполнено только при статусе `Done`, поле `error` только при `Failed`.
        Доступно владельцу объекта и сотрудникам айыл окмоту той же территории.
      responses:
        '200':
          description: Анализ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Analyses]
      summary: Удалить анализ (только тот, кто его запускал)
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analyses/{analysisId}/reports:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [Reports]
      summary: Сформировать отчёт по завершённому анализу
      description: Допустимо только для анализа в статусе `Done`. Файл формируется воркером и кладётся в MinIO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  $ref: '#/components/schemas/ReportFormat'
      responses:
        '202':
          description: Формирование отчёта запущено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Анализ ещё не завершён
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reports]
      summary: Статус отчёта и ссылка на скачивание
      description: При статусе `Done` в `downloadUrl` лежит presigned-ссылка MinIO (действует 10 минут).
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/territory:
    get:
      tags: [Dashboard]
      summary: Дашборд территории (только Official)
      description: |
        Сводка по территории сотрудника: сколько фермеров, полей и пастбищ, как распределяются пастбища
        по уровню засухи (по последнему завершённому анализу) и какие пастбища в зоне риска.
        Агрегаты кэшируются в Redis на 60 секунд.
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT содержит `sub` (id пользователя), `role` (`Farmer` или `Official`) и `territoryId`.

  parameters:
    FieldId:
      name: fieldId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PastureId:
      name: pastureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Роль или права пользователя не позволяют выполнить действие
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден или недоступен пользователю
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyAnalyses:
      description: Слишком много активных анализов у пользователя
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AnalysisAccepted:
      description: Задача принята
      headers:
        Location:
          schema: { type: string }
          description: URL для опроса статуса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Analysis'

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string, example: Not Found }
        status: { type: integer, example: 404 }
        detail: { type: string }
        traceId: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example:
                geometry: ['Полигон должен быть замкнутым']

    Role:
      type: string
      enum: [Farmer, Official]

    Territory:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Ак-Суу айыл аймагы }

    RegisterRequest:
      type: object
      required: [email, password, name, territoryId]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        name: { type: string, minLength: 1, maxLength: 100 }
        territoryId: { type: string, format: uuid }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Время жизни токена в секундах, example: 3600 }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, name, role, territoryId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        territoryId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Polygon:
      type: object
      description: GeoJSON Polygon (WGS84, порядок координат [долгота, широта]). Первое и последнее кольцо замкнуты.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
      example:
        type: Polygon
        coordinates:
          - [[74.60, 42.87], [74.61, 42.87], [74.61, 42.88], [74.60, 42.88], [74.60, 42.87]]

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    ObjectCreate:
      type: object
      description: Тело создания и обновления для поля и пастбища.
      required: [name, geometry]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Северный участок }
        description:
          type: string
          nullable: true
          description: Культура (для поля) или тип пастбища (для пастбища)
          example: пшеница
        geometry:
          $ref: '#/components/schemas/Polygon'

    Field:
      type: object
      required: [id, ownerId, territoryId, name, geometry, centroid, areaHa, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        territoryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        geometry:
          $ref: '#/components/schemas/Polygon'
        centroid:
          $ref: '#/components/schemas/Point'
        areaHa: { type: number, format: double, description: Площадь в гектарах }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FieldPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    LastAnalysisSummary:
      type: object
      nullable: true
      description: Краткий итог последнего завершённого анализа. `null`, если анализа ещё не было.
      required: [analysisId, finishedAt, droughtIndex, droughtLevel]
      properties:
        analysisId: { type: string, format: uuid }
        finishedAt: { type: string, format: date-time }
        droughtIndex: { type: number, example: 0.42 }
        droughtLevel:
          $ref: '#/components/schemas/DroughtLevel'

    Pasture:
      type: object
      required: [id, territoryId, name, geometry, centroid, areaHa, createdAt]
      properties:
        id: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        name: { type: string, example: Жайлоо Кара-Суу }
        description: { type: string, nullable: true }
        geometry:
          $ref: '#/components/schemas/Polygon'
        centroid:
          $ref: '#/components/schemas/Point'
        areaHa: { type: number, format: double }
        lastAnalysis:
          $ref: '#/components/schemas/LastAnalysisSummary'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PasturePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pasture'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    DroughtLevel:
      type: string
      enum: [None, Moderate, Severe]

    AnalysisStatus:
      type: string
      enum: [Pending, Running, Done, Failed]

    TargetType:
      type: string
      enum: [Field, Pasture]

    AnalysisCreate:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date, example: '2026-04-01' }
        periodEnd:
          type: string
          format: date
          example: '2026-09-30'
          description: Не раньше `periodStart`, период не длиннее 366 дней
        gddBaseTemp:
          type: number
          default: 10
          description: Базовая температура для суммы активных температур (GDD), °C

    DailyWeather:
      type: object
      required: [date, tMax, tMin, precipitationMm]
      properties:
        date: { type: string, format: date }
        tMax: { type: number, description: °C }
        tMin: { type: number, description: °C }
        precipitationMm: { type: number }
        gdd: { type: number, description: Активные температуры за день }

    AnalysisResult:
      type: object
      required: [totalPrecipitationMm, gddSum, droughtIndex, droughtLevel, daily]
      properties:
        totalPrecipitationMm: { type: number, example: 312.4 }
        gddSum: { type: number, example: 1840.5 }
        droughtIndex:
          type: number
          description: |
            Индекс засухи, 0..1 (чем больше, тем суше). Формула описывается в README
            (например, доля дней без осадков и дефицит осадков относительно нормы).
          example: 0.42
        droughtLevel:
          $ref: '#/components/schemas/DroughtLevel'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailyWeather'

    Analysis:
      type: object
      required: [id, targetType, targetId, status, periodStart, periodEnd, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetType:
          $ref: '#/components/schemas/TargetType'
        targetId:
          type: string
          format: uuid
          description: Идентификатор поля или пастбища (зависит от `targetType`)
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        gddBaseTemp: { type: number }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        result:
          allOf:
            - $ref: '#/components/schemas/AnalysisResult'
          nullable: true
        error:
          type: string
          nullable: true
          description: Причина ошибки при статусе `Failed`

    AnalysisPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Analysis'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ReportFormat:
      type: string
      enum: [csv, pdf]

    Report:
      type: object
      required: [id, analysisId, format, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        format:
          $ref: '#/components/schemas/ReportFormat'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        downloadUrl:
          type: string
          format: uri
          nullable: true
        createdAt: { type: string, format: date-time }

    TerritoryDashboard:
      type: object
      required: [territory, generatedAt, farmersCount, fields, pastures, pastureCondition, topRiskPastures]
      properties:
        territory:
          $ref: '#/components/schemas/Territory'
        generatedAt: { type: string, format: date-time }
        farmersCount: { type: integer, example: 37 }
        fields:
          $ref: '#/components/schemas/ObjectsSummary'
        pastures:
          $ref: '#/components/schemas/ObjectsSummary'
        pastureCondition:
          type: object
          description: Сколько пастбищ в каждом состоянии по последнему анализу
          required: [none, moderate, severe, notAnalyzed]
          properties:
            none: { type: integer, example: 12 }
            moderate: { type: integer, example: 5 }
            severe: { type: integer, example: 2 }
            notAnalyzed: { type: integer, example: 3 }
        topRiskPastures:
          type: array
          maxItems: 10
          description: Пастбища с наибольшим индексом засухи (по убыванию)
          items:
            $ref: '#/components/schemas/Pasture'

    ObjectsSummary:
      type: object
      required: [count, totalAreaHa]
      properties:
        count: { type: integer }
        totalAreaHa: { type: number, format: double }