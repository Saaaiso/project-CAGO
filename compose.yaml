      APP_DB_USER: ${APP_DB_USER:-back_aidar}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      WORKER_DB_USER: ${WORKER_DB_USER:-worker_max}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
      REPORT_DB_USER: ${REPORT_DB_USER:-report_reader}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD in .env}
